name: Mobile CI

on:
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - "src/app/globals.css" # mobile design tokens are checked against it
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "src/app/globals.css"
      - ".github/workflows/mobile-ci.yml"

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-bundle:
    name: Typecheck, lint, test, bundle (Android + iOS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      # Bundles only need a syntactically valid origin; nothing is contacted.
      EXPO_PUBLIC_API_URL: https://api.invalid
      EXPO_OFFLINE: "1"
      CI: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Bundle Android (Hermes)
        run: npm run export:android

      - name: Bundle iOS (Hermes)
        run: npm run export:ios
