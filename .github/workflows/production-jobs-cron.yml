name: Production background jobs

# Drains the production BackgroundJob queue (WhatsApp retries and deliveries, dispatch timeouts,
# reminders, digests) every 5 minutes. Vercel Hobby runs its own cron (vercel.json) only once a
# day, so this is the frequent trigger; see src/app/api/jobs/run/route.ts and
# docs/whatsapp-operations.md ("Worker").
#
# Needs the repository secret PRODUCTION_JOBS_RUN_SECRET, equal to JOBS_RUN_SECRET in the Vercel
# production environment. Until it is set the job skips itself instead of failing. The target is
# the PRODUCTION_SITE_URL repository variable, or https://nesafric.com.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: production-jobs-run
  cancel-in-progress: false

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/jobs/run
        env:
          SECRET: ${{ secrets.PRODUCTION_JOBS_RUN_SECRET }}
          SITE_URL: ${{ vars.PRODUCTION_SITE_URL || 'https://nesafric.com' }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "PRODUCTION_JOBS_RUN_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 280 -X POST \
            -H "x-jobs-run-secret: $SECRET" \
            "$SITE_URL/api/jobs/run"
