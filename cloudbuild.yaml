# Google Cloud Build: build the NesAfric web image from GitHub, migrate the database, roll out to
# Cloud Run. Runs on every push to main through the trigger in docs/cloud-run-deployment.md, or by
# hand: gcloud builds submit --config cloudbuild.yaml --substitutions COMMIT_SHA=$(git rev-parse HEAD)
#
# The service's settings, secrets and service account are set once by
# deploy/cloud-run/setup.sh; this build only ships a new image, so a rollout never changes them.
substitutions:
  _REGION: europe-west1
  _SERVICE: nesafric-web
  _REPOSITORY: nesafric
  _SITE_URL: https://www.nesafric.com
  # Set _GTM_ID on the trigger to the production NEXT_PUBLIC_GTM_ID (setup.sh prints it); empty
  # leaves Google Tag Manager and analytics off.
  _GTM_ID: ""
  # The service's runtime identity in nesafric-production (Cloud SQL client, secret accessor).
  _RUNTIME_SA: nesafric-web
  # Cloud SQL instance the migration job connects to through the connector socket that
  # DATABASE_URL names; empty when the database is reached over the network.
  _CLOUDSQL_INSTANCE: nesafric-production:europe-west1:nesafric-prod-db
  # "true" when setup.sh ran with USE_STATIC_EGRESS=true (the database allows only listed IPs).
  _STATIC_EGRESS: "false"
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s

steps:
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target=runner
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_GTM_ID=${_GTM_ID}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:${COMMIT_SHA}
      - .

  - id: build-migrate
    name: gcr.io/cloud-builders/docker
    waitFor: [build-web]
    args:
      - build
      - --target=migrate
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/migrate:${COMMIT_SHA}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:${COMMIT_SHA} &&
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/migrate:${COMMIT_SHA}

  # Apply pending Prisma migrations before the new code serves traffic. A failed migration stops
  # the build here, so the running revision keeps serving the old code.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        flags=()
        if [ "${_STATIC_EGRESS}" = "true" ]; then
          # The service leaves through the static-IP NAT (setup.sh USE_STATIC_EGRESS); so must the job.
          flags=(--network=default --subnet=default --vpc-egress=all-traffic)
        fi
        if [ -n "${_CLOUDSQL_INSTANCE}" ]; then
          flags+=(--set-cloudsql-instances=${_CLOUDSQL_INSTANCE})
        fi
        gcloud run jobs deploy ${_SERVICE}-migrate \
          --region=${_REGION} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/migrate:${COMMIT_SHA} \
          --service-account=${_RUNTIME_SA}@${PROJECT_ID}.iam.gserviceaccount.com \
          --set-secrets=DATABASE_URL=DATABASE_URL:latest \
          --max-retries=0 --task-timeout=600s "$${flags[@]}" \
          --execute-now --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:${COMMIT_SHA}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/web:${COMMIT_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/migrate:${COMMIT_SHA}
